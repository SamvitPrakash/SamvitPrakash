<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Full-stack development. Cybersecurity curiosity. Systems tinkering.">
  <defs>
    <style>
      :root{ --bg:#eaf7fb; --text:#0b1f2a; --primary:#176b87; --secondary:#8fd3e8; --accent:#25a9d6; }
      @media (prefers-color-scheme: dark){
        :root{ --bg:#07151b; --text:#dff5fa; --primary:#7bcce3; --secondary:#185d73; --accent:#39c6ed; }
      }
      .card{ fill:var(--bg); stroke:var(--secondary); stroke-width:1.5; }
      .band{ fill:var(--primary); }
      .h{ fill:var(--text); font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:700; font-size:18px; }
      .p{ fill:var(--text); font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:12.5px; opacity:0.85; }
      .icon{ fill:none; stroke:var(--accent); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <!-- Card 1 -->
  <rect x="0" y="0" width="288" height="150" rx="16" class="card"/>
  <rect x="0" y="0" width="288" height="6" rx="3" class="band"/>
  <path class="icon" d="M28 40 L14 55 L28 70 M52 40 L66 55 L52 70 M46 32 L34 78"/>
  <text x="14" y="98" class="h">Full-Stack Dev</text>
  <text x="14" y="118" class="p">React, Angular, Vue, Django,</text>
  <text x="14" y="134" class="p">Node.js, PostgreSQL, Supabase</text>

  <!-- Card 2 -->
  <rect x="306" y="0" width="288" height="150" rx="16" class="card"/>
  <rect x="306" y="0" width="288" height="6" rx="3" class="band"/>
  <path class="icon" d="M450 34 L426 44 L426 62 C426 76 436 84 450 90 C464 84 474 76 474 62 L474 44 Z"/>
  <text x="320" y="98" class="h">Cybersecurity</text>
  <text x="320" y="118" class="p">Interested in systems security,</text>
  <text x="320" y="134" class="p">CI/CD hardening and defensive tooling</text>

  <!-- Card 3 -->
  <rect x="612" y="0" width="288" height="150" rx="16" class="card"/>
  <rect x="612" y="0" width="288" height="6" rx="3" class="band"/>
  <rect class="icon" x="726" y="30" width="48" height="34" rx="4"/>
  <path class="icon" d="M736 64 L736 74 M764 64 L764 74 M726 74 L774 74"/>
  <circle class="icon" cx="750" cy="47" r="9"/>
  <text x="626" y="98" class="h">Systems &amp; Desktop</text>
  <text x="626" y="118" class="p">Arch/Hyprland tinkerer, builder of</text>
  <text x="626" y="134" class="p">Direwolf — a custom Linux shell</text>
</svg>
