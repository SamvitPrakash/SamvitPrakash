name: Update GitHub Stats

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=SamvitPrakash&show_icons=true&theme=transparent&hide_border=true&title_color=25A9D6&icon_color=176B87&text_color=0B1F2A&ring_color=25A9D6
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=SamvitPrakash&layout=compact&langs_count=8&theme=transparent&hide_border=true&title_color=25A9D6&text_color=0B1F2A
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=SamvitPrakash&theme=transparent&hide_border=true&ring=25A9D6&fire=25A9D6&currStreakLabel=25A9D6&sideLabels=0B1F2A&dates=0B1F2A
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: username=${{ github.repository_owner }}&theme=algolia&no-frame=true&no-bg=true&margin-w=8&row=1&column=6
          path: assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/streak.svg assets/trophy.svg
          git commit -m "Update GitHub stats" || exit 0
          git push